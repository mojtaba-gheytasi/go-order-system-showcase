syntax = "proto3";

package order.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/mojtaba-gheytasi/go-order-system-showcase/order-service/api/gen/order/v1;orderv1";

// OrderAccepted announces that an order reached the accepted state.
//
// Published by order-service to the "orders" topic exchange with routing key
// "order.accepted.v1", after the transition from pending to accepted was committed.
// Both names are constants in this module's orderevents package.
//
// NAME. The accepted order state was durably committed before this event was published.
// An order is created as pending well before this point.
//
// DELIVERY. At-least-once publication; at-least-once processing once routed into a
// queue. The event is saved in an outbox in the same transaction as the acceptance and
// published later, in the background, so it can arrive a while after the order was
// accepted. An unknown publication outcome is retried, so the same event, with the same
// event_id, can arrive more than once. An event whose retries are used up is kept for a
// manual redrive rather than dropped. Tolerate duplicates and late arrivals.
//
// COMPATIBILITY. Field numbers are never reused or renumbered; deletions are reserved.
// Adding a field is binary-wire-safe, which is not the same as harmless: ignore fields
// you do not know, and anything added to v1 must behave correctly when absent, because
// events already queued were encoded without it. A change to what an existing field
// means is a new version, never an edit to this one.
message OrderAccepted {
  // Sent as the AMQP message_id.
  //
  // Deliberately not the deduplication key for sending an email: two events could
  // describe the same effect. What must not repeat is the effect — one confirmation per
  // order, kind and channel — which is the consumer's own business.
  string event_id = 1;

  string order_id = 2;

  // Audit data, NOT an ordering guarantee: two events cannot be reliably ordered by
  // comparing it. Ordering would need an aggregate sequence number, which is a contract
  // change rather than a new reading of this field.
  google.protobuf.Timestamp occurred_at = 3;

  string customer_email = 4;

  // Deliberately not a payment status: payment is outside this system.
  Money total_amount = 5;

  // Order is not meaningful; do not depend on the sequence.
  repeated OrderLine lines = 6;
}

// An exact amount in a currency's minor unit — 1250 is 12.50 EUR. Integer minor units
// because money that is added and compared cannot afford binary rounding. Signed, so a
// later credit or refund needs no wire change.
message Money {
  int64 amount_in_minor_units = 1;
  // ISO 4217, uppercase.
  string currency = 2;
}

// Prices are captured when the order was placed, not whatever the catalogue says now:
// an accepted order is an immutable snapshot, prices included.
message OrderLine {
  string product_sku = 1;
  // Always greater than zero. proto3 cannot express that, so the consumer validates it.
  int32 quantity = 2;
  // For a single unit, not the line total.
  Money unit_price = 3;
}
