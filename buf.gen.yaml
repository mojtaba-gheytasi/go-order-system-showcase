version: v2

# Remote plugins, so generating the code needs only buf — no protoc-gen-go or
# protoc-gen-go-grpc installed locally, and every machine produces byte-identical
# output because the plugin versions are pinned here.
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: inventory-service/api/gen
    opt: paths=source_relative

  - remote: buf.build/grpc/go:v1.5.1
    out: inventory-service/api/gen
    opt: paths=source_relative
